[package]
name = "novel-translate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "novel-translate-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "color", "help", "usage", "error-context", "suggestions"] }
nt-application = { path = "../../crates/nt-application" }
nt-storage = { path = "../../crates/nt-storage" }
nt-tui = { path = "../../crates/nt-tui" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]

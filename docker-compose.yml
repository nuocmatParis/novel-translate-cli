services:
  novel-translate:
    image: novel-translate-cli:local
    build:
      context: .
    volumes:
      - ./workspace:/workspace
      - translation-user-data:/root/.novel-translate
      - ./config/provider.json:/root/.novel-translate/config.json:ro
      - ./tools/epubcheck:/tools/epubcheck:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      NOVEL_TRANSLATE_API_KEY: ${NOVEL_TRANSLATE_API_KEY:-}

volumes:
  translation-user-data:
